name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: file:./ci-unused.db
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: ci-fixture-secret-unused-outside-isolated-checks
      GOOGLE_CLIENT_ID: ci-check.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-fixture-unused-outside-checks
      ACADEMIC_EMAIL_DOMAINS: iiml.ac.in
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
