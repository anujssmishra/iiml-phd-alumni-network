name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: file:./ci-unused.db
      NEXTAUTH_URL: http://127.0.0.1:3100
      NEXTAUTH_SECRET: ci-fixture-secret-unused-outside-isolated-checks
      GOOGLE_CLIENT_ID: ci-check.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-fixture-unused-outside-checks
      ACADEMIC_EMAIL_DOMAINS: iiml.ac.in
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.7.0
      - run: npm ci
      # Registry checks are deliberately outside the offline workload boundary.
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lsof iproute2 util-linux
      - run: npm run db:validate
      # Ubuntu restricts user namespace mapping. Create a network namespace as
      # root, then drop UID/capabilities before Node; no host policy changes.
      - run: bash scripts/offline-linux-ci.sh check
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/offline-linux-ci.sh browser
      - run: bash scripts/offline-linux-ci.sh browser tests/browser/signin.spec.ts tests/browser/p2b.spec.ts tests/browser/p2c.spec.ts tests/browser/offline.spec.ts
        env:
          BROWSER_SERVER_MODE: production
          BROWSER_APP_ENV: local
